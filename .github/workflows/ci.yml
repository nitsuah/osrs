name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Security audit with pip-audit
      # Signal only, not a gate: nltk 3.10.3 currently has an open advisory
      # (PYSEC-2026-3740) with no patched release yet, so a hard failure
      # here would permanently redden CI. Findings still show in the logs.
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Install xvfb for headless display
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Test with pytest
      run: |
        xvfb-run -a pytest

    - name: Build with pyinstaller
      run: |
        pyinstaller --onefile -n osrs-bot bot/core.py